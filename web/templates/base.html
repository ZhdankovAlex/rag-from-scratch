<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}rag-from-scratch{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<link rel="stylesheet" href="/static/app.css?v={{ v }}">
<script>
  // before first paint, so the panel does not jump: collapsed state is remembered in localStorage
  try { if (localStorage.getItem('nav-collapsed') === '1') document.documentElement.classList.add('nav-collapsed'); } catch (e) {}
</script>
</head>
<body data-page="{{ active }}">
<aside class="sidenav">
  <a class="brand" href="/" title="rag-from-scratch">
    <span class="brand-ic" aria-hidden="true">📖</span>
    <span class="nav-label">rag-from-scratch</span>
  </a>
  <nav>
    {% for key, label, icon in nav %}
    <a href="/{{ key }}" class="{{ 'on' if key == active }}" title="{{ label }}">
      <span class="nav-ic" aria-hidden="true">{{ icon }}</span><span class="nav-label">{{ label }}</span>
    </a>
    {% endfor %}
    <a href="/docs" title="API (Swagger)" target="_blank" rel="noopener">
      <span class="nav-ic" aria-hidden="true">🧩</span><span class="nav-label">API</span>
    </a>
  </nav>
  <div class="sidenav-foot">
    <div class="status-pill" id="st-index" title="Чанков в индексе"><i class="dot-st"></i><span class="nav-label" id="st-index-text">индекс…</span></div>
    <div class="status-pill" id="st-llm" title="Локальная LLM"><i class="dot-st"></i><span class="nav-label" id="st-llm-text">Ollama…</span></div>
    <button class="nav-toggle" id="nav-toggle" type="button" title="Свернуть / развернуть панель" aria-label="Свернуть / развернуть панель">
      <span class="nav-ic" aria-hidden="true">«</span><span class="nav-label">Свернуть</span>
    </button>
  </div>
</aside>
<main class="page">
{% block content %}{% endblock %}
</main>
<script src="/static/app.js?v={{ v }}"></script>
</body>
</html>
